<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Pals - Feedback Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0A5F8C;
            --accent-color: #FF6B4A;
            --success-color: #28A745;
            --danger-color: #DC3545;
            --text-dark: #2C3E50;
            --text-light: #6C757D;
            --bg-light: #F8F9FA;
            --border-color: #E0E0E0;
        }

        body {
            background: var(--bg-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-dark);
            padding: 2rem 0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .admin-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .admin-header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }

        .controls-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-select {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(10, 95, 140, 0.1);
            outline: none;
        }

        .audit-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-light);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-card .stat-label {
            color: var(--text-light);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.success .stat-number {
            color: var(--success-color);
        }

        .stat-card.danger .stat-number {
            color: var(--danger-color);
        }

        .stat-card.primary .stat-number {
            color: var(--primary-color);
        }

        .audit-grid {
            display: grid;
            gap: 1rem;
        }

        .volunteer-section {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .volunteer-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .student-list {
            padding: 0.5rem;
        }

        .student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s ease;
        }

        .student-item:last-child {
            margin-bottom: 0;
        }

        .student-item.completed {
            background: rgba(40, 167, 69, 0.1);
            border: 2px solid var(--success-color);
        }

        .student-item.missing {
            background: rgba(220, 53, 69, 0.1);
            border: 2px solid var(--danger-color);
        }

        .student-item.loading {
            background: var(--bg-light);
            border: 2px solid var(--border-color);
        }

        .student-name {
            font-weight: 500;
            font-size: 1rem;
        }

        .student-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .student-status i {
            font-size: 1.2rem;
        }

        .student-item.completed .student-status {
            color: var(--success-color);
        }

        .student-item.missing .student-status {
            color: var(--danger-color);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container admin-container">
        <div class="admin-header">
            <h1><i class="bi bi-clipboard-check"></i> Feedback Audit</h1>
            <p>Track which volunteers have submitted feedback for each session</p>
        </div>

        <div class="controls-card">
            <div class="row">
                <div class="col-md-6">
                    <label for="dateSelect" class="form-label">Select Session Date</label>
                    <select class="form-select" id="dateSelect">
                        <option value="">Loading dates...</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button class="btn btn-primary w-100" id="refreshBtn">
                        <i class="bi bi-arrow-clockwise"></i> Refresh Data
                    </button>
                </div>
            </div>
        </div>

        <div id="statsSection" style="display: none;">
            <div class="stats-row">
                <div class="stat-card primary">
                    <div class="stat-number" id="totalPairsCount">0</div>
                    <div class="stat-label">Total Expected</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-number" id="missingCount">0</div>
                    <div class="stat-label">Missing</div>
                </div>
                <div class="stat-card primary">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">Completion Rate</div>
                </div>
            </div>
        </div>

        <div class="audit-card">
            <div id="loadingSection" class="loading-spinner" style="display: none;">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Checking feedback status...</p>
            </div>

            <div id="emptyState" class="empty-state">
                <i class="bi bi-calendar-event"></i>
                <h3>Select a Date</h3>
                <p>Choose a session date above to view the feedback audit</p>
            </div>

            <div id="auditGrid" class="audit-grid" style="display: none;">
                <!-- Volunteer sections will be inserted here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../simple-supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
