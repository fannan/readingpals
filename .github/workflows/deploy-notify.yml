name: Deploy Notification

on:
  push:
    branches:
      - v1

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "🚀 Reading Pals Tracker deployed to Cloudflare Pages",
            "blocks": [{
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Reading Pals Tracker* deployed successfully!\n\n*Branch:* `'"${{ github.ref_name }}"'`\n*Commit:* '"${{ github.event.head_commit.message }}"'\n*Author:* '"${{ github.event.head_commit.author.name }}"'\n\n<https://readingpals.pages.dev|View Site>"
              }
            }]
          }'
