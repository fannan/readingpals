<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Pals - Feedback Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .header-icon {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 20px;
        }
        .table-responsive {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-weight: 600;
            padding: 20px 15px;
        }
        .table tbody tr {
            transition: all 0.3s ease;
        }
        .table tbody tr:hover {
            background-color: #f8f9fa;
        }
        .table tbody td {
            padding: 20px 15px;
            vertical-align: middle;
            border-color: #e9ecef;
        }
        .volunteer-name {
            font-weight: 600;
            color: #495057;
        }
        .file-date {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .file-size {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #495057;
        }
        .audio-control {
            width: 200px;
        }
        .btn-download {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            color: white;
        }
        .stats-row {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-11">
                <div class="card main-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="header-icon">
                            <i class="bi bi-folder-open"></i>
                        </div>
                        <h1 class="h2 mb-1 text-primary">Feedback Admin</h1>
                        <p class="text-muted mb-0">View volunteer feedback recordings</p>
                    </div>

                    <div class="row stats-row text-center">
                        <div class="col-md-4">
                            <h3 class="mb-1" id="totalFiles">-</h3>
                            <small>Total Recordings</small>
                        </div>
                        <div class="col-md-4">
                            <h3 class="mb-1" id="uniqueVolunteers">-</h3>
                            <small>Active Volunteers</small>
                        </div>
                        <div class="col-md-4">
                            <h3 class="mb-1" id="lastUpdated">-</h3>
                            <small>Last Updated</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">All Feedback Files</h4>
                        <button class="btn btn-primary" id="refreshBtn">
                            <i class="bi bi-arrow-clockwise me-2"></i>Refresh
                        </button>
                    </div>

                    <div id="loadingSection" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mt-3">Loading feedback files...</p>
                    </div>

                    <div id="filesSection" style="display: none;">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Volunteer</th>
                                        <th colspan="2">Time</th>
                                        <th>Size</th>
                                        <th>Audio</th>
                                        <th>Download</th>
                                    </tr>
                                </thead>
                                <tbody id="filesTableBody">
                                    <!-- Files will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="errorSection" class="alert alert-danger" style="display: none;">
                        <h6><i class="bi bi-exclamation-triangle me-2"></i>Error Loading Files</h6>
                        <p class="mb-0" id="errorMessage">Unable to load files.</p>
                    </div>

                    <div class="text-center mt-4">
                        <a href="index.html" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Feedback Form
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="simple-supabase.js"></script>
    <script>
        class SimpleAdmin {
            constructor() {
                this.storage = new SimpleSupabaseUpload();
                this.files = [];

                this.initializeElements();
                this.bindEvents();
                this.loadFiles();
            }

            initializeElements() {
                this.loadingSection = document.getElementById('loadingSection');
                this.filesSection = document.getElementById('filesSection');
                this.errorSection = document.getElementById('errorSection');
                this.filesTableBody = document.getElementById('filesTableBody');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.totalFiles = document.getElementById('totalFiles');
                this.uniqueVolunteers = document.getElementById('uniqueVolunteers');
                this.lastUpdated = document.getElementById('lastUpdated');
                this.errorMessage = document.getElementById('errorMessage');
            }

            bindEvents() {
                this.refreshBtn.addEventListener('click', () => this.refreshFiles());
            }

            async loadFiles() {
                try {
                    this.showLoading();
                    console.log('Loading files...');

                    this.files = await this.storage.listFiles();
                    console.log('Files loaded:', this.files);

                    this.updateStats();
                    this.renderFiles();
                    this.showFiles();
                } catch (error) {
                    console.error('Error loading files:', error);
                    this.showError(error.message);
                }
            }

            updateStats() {
                this.totalFiles.textContent = this.files.length;

                // Count unique volunteers (if files have metadata)
                const volunteers = new Set();
                this.files.forEach(file => {
                    if (file.name) {
                        const parts = file.name.split('/');
                        if (parts.length > 1) {
                            const fileName = parts[1];
                            const volunteerPart = fileName.split('-')[0];
                            if (volunteerPart) {
                                volunteers.add(volunteerPart);
                            }
                        }
                    }
                });

                this.uniqueVolunteers.textContent = volunteers.size;
                this.lastUpdated.textContent = new Date().toLocaleTimeString();
            }

            renderFiles() {
                if (this.files.length === 0) {
                    this.filesTableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No files found</td></tr>';
                    return;
                }

                // Group files by date folder
                const filesByDate = {};
                this.files.forEach(file => {
                    const datePart = file.name.split('/')[0];
                    if (!filesByDate[datePart]) {
                        filesByDate[datePart] = [];
                    }
                    filesByDate[datePart].push(file);
                });

                // Sort dates in descending order (newest first)
                const sortedDates = Object.keys(filesByDate).sort((a, b) => new Date(b) - new Date(a));

                let html = '';
                sortedDates.forEach(date => {
                    // Add date header row
                    const formattedDate = new Date(date).toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    html += `
                        <tr style="background: linear-gradient(45deg, #667eea, #764ba2); color: white;">
                            <td colspan="6" class="text-center fw-bold py-3">
                                <i class="bi bi-calendar3 me-2"></i>${formattedDate}
                            </td>
                        </tr>
                    `;

                    // Add files for this date
                    filesByDate[date].forEach(file => {
                        html += this.createFileRow(file);
                    });
                });

                this.filesTableBody.innerHTML = html;
            }

            createFileRow(file) {
                const fileName = file.name || 'unknown';
                const parts = fileName.split('/');
                const actualFileName = parts[1] || fileName;

                // Parse volunteer name from filename
                const volunteerParts = actualFileName.split('-');
                const volunteerName = volunteerParts[0] || 'Unknown';

                // Get file URL
                const fileUrl = `https://ygsekzeiirebuvzdbyxc.supabase.co/storage/v1/object/public/feedback-recordings/${fileName}`;

                // Format file size
                const fileSize = file.metadata?.size ? this.formatFileSize(file.metadata.size) : 'Unknown';

                // Get time from created_at or filename
                let time = 'Unknown';
                if (file.created_at) {
                    time = new Date(file.created_at).toLocaleTimeString();
                } else if (volunteerParts.length >= 4) {
                    // Try to parse time from filename: volunteer-HH-MM-SS-timestamp
                    const timeStr = volunteerParts.slice(1, 4).join(':');
                    if (timeStr.match(/\d{2}:\d{2}:\d{2}/)) {
                        time = timeStr;
                    }
                }

                return `
                    <tr>
                        <td>
                            <div class="volunteer-name">${this.formatVolunteerName(volunteerName)}</div>
                        </td>
                        <td colspan="2">
                            <div class="file-date">${time}</div>
                        </td>
                        <td>
                            <span class="file-size">${fileSize}</span>
                        </td>
                        <td>
                            <audio controls class="audio-control">
                                <source src="${fileUrl}" type="audio/webm">
                                <source src="${fileUrl}" type="audio/mpeg">
                                Your browser does not support audio.
                            </audio>
                        </td>
                        <td>
                            <a href="${fileUrl}" download="${actualFileName}" class="btn-download">
                                <i class="bi bi-download me-1"></i>Download
                            </a>
                        </td>
                    </tr>
                `;
            }

            formatVolunteerName(name) {
                return name.split('-').map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                ).join(' ');
            }

            formatFileSize(bytes) {
                if (!bytes) return 'Unknown';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            async refreshFiles() {
                this.refreshBtn.disabled = true;
                this.refreshBtn.innerHTML = '<i class="bi bi-arrow-clockwise spinner-border spinner-border-sm me-2"></i>Refreshing...';

                try {
                    await this.loadFiles();
                } finally {
                    this.refreshBtn.disabled = false;
                    this.refreshBtn.innerHTML = '<i class="bi bi-arrow-clockwise me-2"></i>Refresh';
                }
            }

            showLoading() {
                this.loadingSection.style.display = 'block';
                this.filesSection.style.display = 'none';
                this.errorSection.style.display = 'none';
            }

            showFiles() {
                this.loadingSection.style.display = 'none';
                this.filesSection.style.display = 'block';
                this.errorSection.style.display = 'none';
            }

            showError(message) {
                this.loadingSection.style.display = 'none';
                this.filesSection.style.display = 'none';
                this.errorSection.style.display = 'block';
                this.errorMessage.textContent = message;
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new SimpleAdmin();
        });
    </script>
</body>
</html>
